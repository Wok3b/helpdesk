server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # The browser talks to one origin; nginx forwards API calls to the backend container.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build files never change, so browsers can cache them for a year.
    location ~* \.(js|css|woff2?|png|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Angular handles routing in the browser: unknown paths get index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
