name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: API · build and test
    runs-on: ubuntu-latest
    services:
      sql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Ci-Only-Passw0rd!
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Ci-Only-Passw0rd!' -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - name: Test (unit + integration against SQL Server)
        run: dotnet test --no-build -c Release --logger "trx;LogFileName=results.trx"
        env:
          HELPDESK_TEST_SQL: Server=localhost,1433;User Id=sa;Password=Ci-Only-Passw0rd!;TrustServerCertificate=True

  frontend:
    name: Web · test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx ng test --watch=false
      - run: npx ng build --configuration production

  stack:
    name: Docker · full stack smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build
      - name: Sign in through nginx → API → SQL Server
        run: |
          for i in $(seq 1 40); do
            code=$(curl -s -o /tmp/login.json -w "%{http_code}" -X POST http://localhost:8080/api/auth/login \
              -H 'Content-Type: application/json' -d '{"email":"tech@helpdesk.local","password":"Demo123!"}' || true)
            if [ "$code" = "200" ]; then echo "Login OK"; exit 0; fi
            sleep 5
          done
          docker compose logs api
          exit 1
      - if: always()
        run: docker compose down -v
